name: Deploy Cloudflare Worker

# worker/ 변경이 main 에 들어오면 프록시 워커를 자동 배포한다.
# (PWA Pages 배포와 별개 — 이전엔 수동 `wrangler deploy` 필요했음)
#
# 필요한 repo 시크릿:
#   CLOUDFLARE_API_TOKEN   (필수) — Workers 배포 권한 토큰
#   CLOUDFLARE_ACCOUNT_ID  (선택) — 토큰이 여러 계정에 걸쳐 있을 때만 필요
# 인증키 등 런타임 시크릿(SERVICE_KEY)은 워커에 이미 주입돼 있으면 배포로 지워지지 않는다.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Deploy (wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 첫 페인트 배경을 인라인으로 즉시 적용(번들 CSS 로드 전). html 캔버스 색이 iOS 상태바(다이나믹 아일랜드 옆) 띠 색이 되므로 다크모드를 따라가야 한다 — html 에 배경이 생기면 body 배경은 캔버스로 전파되지 않는다. -->
    <style>html,body{margin:0;background:#fff}@media (prefers-color-scheme:dark){html,body{background:#16181d}}</style>
    <!-- iOS 는 상태바 띠 색을 첫 페인트의 html 캔버스에서 집으므로, 앱에 저장된 테마(수동 토글이
         기기 설정과 다를 수 있음)를 React 마운트 전에 반영해야 한다. 저장값 없으면 기기 설정. -->
    <script>
      try {
        var t = localStorage.getItem('ward-pillcheck:theme');
        var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
        document.documentElement.style.background = d ? '#16181d' : '#fff';
      } catch (e) {}
    </script>
    <!-- Pretendard 폰트 CDN: 렌더 비차단으로 로드(외부 CSS 가 첫 페인트를 막지 않게 — 사파리 첫 실행·인트라넷 검은화면 방지). 받기 전엔 system-ui 폴백. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    </noscript>
    <title>지참약 식별 · ward-pillcheck</title>
  </head>
  <body>
    <!-- 마운트 전 잠깐의 빈 화면 대신 가벼운 로딩 표시(React 가 #root 를 교체) -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Pretendard,system-ui,sans-serif;color:#8a8f98;background:#ffffff">
        <div style="width:34px;height:34px;border-radius:50%;border:3px solid #e6e8eb;border-top-color:#2f6bff;animation:appspin .8s linear infinite"></div>
        <div style="font-size:14px;font-weight:700;letter-spacing:-0.3px">지참약 식별 · 불러오는 중…</div>
      </div>
    </div>
    <style>
      @keyframes appspin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
